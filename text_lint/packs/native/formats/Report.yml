# tg-cli's report format (validateReportFormat): a malformed `--tag report` message from an
# agent, as the intent classifier finds it (native/intent.py); skipped for --automated.
id: Format.Report
kind: format
severity: error
profiles: [tg-bot]
message: "This report is not in the report format (tg help report)."
replacement: "tg report --title … --ticket … --impact … --verify-cmd … --verify-result …"
params: {validator: report}
examples:
  flag:
    - "Готово, задеплоил."
  pass:
    - "Готово: #690 смержен, CI зелёный, деплой прошёл."
