# «Ниже приведён…», «Вот краткое резюме», «Подведём итоги»: announcing content instead of
# giving it.
extends: existence
message: "Анонс вместо содержания: «%s». Уберите и дайте сам список или вывод."
level: warning
ignorecase: true
tokens:
  - 'ниже (?:привед[её]н[аоы]?|представлен[аоы]?)'
  - 'вот (?:краткое )?(?:резюме|сводка)'
  - 'подвед[её]м итог(?:и)?'
