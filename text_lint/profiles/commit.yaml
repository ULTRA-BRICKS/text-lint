# Commit messages: ai-tells-commits and TextLint, no ai-tells (the .commit style set).
name: commit
fail_on: warning
markup: markdown
packs: [dict, script]
engines:
  native: {enabled: true}
  vale: {enabled: true, options: {ext: .commit}}
  aiw-ru: {enabled: true, options: {context: technical}}
  laya:
    enabled: true
    optional: false  # required: no flag or env var turns Laya off
    options: {questions: [slop], max_chars: 2000, timeout_ms: 1500, start_wait_ms: 60000}
