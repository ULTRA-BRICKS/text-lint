# Messages the bot sends. Emoji are allowed: rules whose only target is emoji are off.
# Vale and aiw-ru findings are capped at warning during the warn phase (spec 4.5).
name: tg-bot
fail_on: error
markup: markdown
packs: [dict, script, formats, intent, structure]
engines:
  native: {enabled: true}
  vale: {enabled: true, optional: true, cap: warning, options: {ext: .tg, disable: [TextLint.DoneEmoji]}}
  aiw-ru: {enabled: true, optional: true, cap: warning, options: {context: telegram}}
  laya:
    enabled: true
    optional: false  # required: no flag or env var turns Laya off
    options: {questions: [asks_reader, slop], max_chars: 2000, timeout_ms: 1500, start_wait_ms: 60000}
