# PR title and body: prose plus ai-tells-commits (the .pr style set in vale.ini).
name: pr
fail_on: warning
markup: markdown
packs: [dict, script]
engines:
  native: {enabled: true}
  vale: {enabled: true, options: {ext: .pr}}
  aiw-ru: {enabled: true, options: {context: docs}}
  laya:
    enabled: true
    optional: false  # required: no flag or env var turns Laya off
    options: {questions: [slop], max_chars: 2000, timeout_ms: 1500, start_wait_ms: 60000}
