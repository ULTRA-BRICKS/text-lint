[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "hyper-text-lint"
# Single source of truth: the version lives in text_lint.__version__ and is resolved
# here at build time (see [tool.setuptools.dynamic] below).
dynamic = ["version"]
description = "text-lint: flag AI tells in English and Russian prose (Vale + vale-ai-tells, aiw-ru, own rule pack)."
readme = "README.md"
license = "MIT"
# aiw-ru requires Python >= 3.12.
requires-python = ">=3.12"
dependencies = ["aiw-ru>=2.5,<3"]

[project.scripts]
text-lint = "text_lint.cli:main"
# Deprecated 0.1 name: prints a deprecation line and runs `text-lint check`.
slop-check = "text_lint.shim:main"

# Explicit package list (NOT setuptools flat-layout autodiscovery).
[tool.setuptools.packages.find]
include = ["text_lint*"]

# The vendored Vale styles, config and rule samples ship inside the package, so a wheel
# install works offline.
[tool.setuptools.package-data]
text_lint = ["packs/vale/vale.ini", "packs/vale/samples.tsv", "packs/vale/styles/**/*"]

[tool.setuptools.dynamic]
version = { attr = "text_lint.__version__" }
