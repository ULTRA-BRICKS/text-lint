[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "hyper-slop-check"
# Single source of truth: the version lives in slop_cli.__version__ and is resolved
# here at build time (see [tool.setuptools.dynamic] below).
dynamic = ["version"]
description = "slop-check: flag AI tells in English and Russian prose (Vale + vale-ai-tells, aiw-ru, own rule pack)."
readme = "README.md"
license = "MIT"
# aiw-ru requires Python >= 3.12.
requires-python = ">=3.12"
dependencies = ["aiw-ru>=2.5,<3"]

[project.scripts]
slop-check = "slop_cli.cli:main"

# Explicit package list (NOT setuptools flat-layout autodiscovery).
[tool.setuptools.packages.find]
include = ["slop_cli*"]

# The vendored Vale styles and config ship inside the package, so a wheel install works offline.
[tool.setuptools.package-data]
slop_cli = ["vale/vale.ini", "vale/styles/**/*"]

[tool.setuptools.dynamic]
version = { attr = "slop_cli.__version__" }
