[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "hyper-text-lint"
# Single source of truth: the version lives in text_lint.__version__ and is resolved
# here at build time (see [tool.setuptools.dynamic] below).
dynamic = ["version"]
description = "text-lint: flag AI tells in English and Russian prose (Vale + vale-ai-tells, aiw-ru, own rule pack)."
readme = "README.md"
license = "MIT"
# aiw-ru requires Python >= 3.12.
requires-python = ">=3.12"
# PyYAML reads the profiles (and, later, rule packs and .text-lint.yaml); jsonschema
# validates native rule files against schema/native-rule-v1.json.
dependencies = ["aiw-ru>=2.5,<3", "PyYAML>=6,<7", "jsonschema>=4,<5"]

[project.scripts]
text-lint = "text_lint.cli:main"
# Deprecated 0.1 name: prints a deprecation line and runs `text-lint check`.
slop-check = "text_lint.shim:main"

# Explicit package list (NOT setuptools flat-layout autodiscovery).
[tool.setuptools.packages.find]
include = ["text_lint*"]

# Every runtime asset ships inside the package, so a wheel install works offline: profiles,
# JSON schemas, rule packs (the vendored Vale styles, vale.ini, samples, native packs) and
# the UI-string extraction rules.
[tool.setuptools.package-data]
text_lint = ["profiles/*.yaml", "schema/*.json", "packs/**/*", "extract/rules/*.yml"]

[tool.setuptools.dynamic]
version = { attr = "text_lint.__version__" }
