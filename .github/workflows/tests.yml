# Test gate — run the repo's pytest suite on every PR (from agent-tools ci/tests, plus engines).
#
# The green/red merge signal: `uv run --no-project --with pytest pytest tests/`.
# Unit tests fake the engines; the integration test runs the real ones, so this job installs
# both: Vale from its pinned, checksum-verified release binary, and aiw-ru through uv
# (TEST_EXTRA_DEPS). SLOP_CHECK_REQUIRE_ENGINES=1 turns the integration test's
# "engine not installed" skip into a failure, so CI can never pass without running it.
#
# Runs the PR's own code, so it uses `pull_request` (NOT pull_request_target).
# Pin actions to commit SHAs.

name: tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pytest:
    name: pytest
    runs-on: ubuntu-latest
    env:
      TEST_PATHS: tests
      TEST_EXTRA_DEPS: "aiw-ru>=2.5,<3"
      PYTEST_SPEC: "pytest>=8,<9"
      VALE_VERSION: "3.24.0"
      VALE_SHA256: "867534ddb678abca7f214bc4706ead0922bd5252ffe8035fc227013f66c8b214"
      SLOP_CHECK_REQUIRE_ENGINES: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          python-version: "3.12"

      - name: Install Vale
        run: |
          set -euo pipefail
          tarball="vale_${VALE_VERSION}_Linux_64-bit.tar.gz"
          curl -fsSL -o "/tmp/${tarball}" \
            "https://github.com/vale-cli/vale/releases/download/v${VALE_VERSION}/${tarball}"
          echo "${VALE_SHA256}  /tmp/${tarball}" | sha256sum -c -
          mkdir -p "$HOME/.local/bin"
          tar -xzf "/tmp/${tarball}" -C "$HOME/.local/bin" vale
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/vale" --version

      - name: Run pytest
        run: |
          set -euo pipefail
          if [ ! -d tests ] && [ "${TEST_PATHS}" = "tests" ]; then
            echo "::error::no tests/ directory found — set TEST_PATHS or add tests."
            exit 1
          fi
          extra=""
          for dep in ${TEST_EXTRA_DEPS}; do extra="${extra} --with ${dep}"; done
          # --no-project: run against the source checkout without building it as a dist.
          # shellcheck disable=SC2086
          uv run --no-project --python 3.12 --with "${PYTEST_SPEC}" ${extra} pytest ${TEST_PATHS} -q
