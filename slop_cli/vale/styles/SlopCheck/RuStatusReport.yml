# Russian agent status-report phrasing.
extends: existence
message: "Отчётный штамп: «%s». Скажите, что изменилось, и дайте ссылку на доказательство."
level: warning
ignorecase: true
tokens:
  - 'успешно (?:реализова|выполн|заверш|добав|исправ|внедр|разв[её]рну|обнов|сдела|интегрир|настро)[а-яё]*'
  - 'вс[её] (?:работает|готово) (?:отлично|идеально|как надо|как часы)'
  - 'задача (?:успешно )?(?:выполнена|решена|завершена)'
