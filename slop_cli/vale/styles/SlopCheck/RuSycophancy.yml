# Russian flattery that aiw-ru does not list (it has «отличный/хороший вопрос», «вы абсолютно
# правы», «рад помочь»).
extends: existence
message: "Лесть: «%s». Удалите и начните с сути."
level: error
ignorecase: true
tokens:
  - '(?:отличный|хороший) улов'
  - '(?:хорошее|отличное|верное|точное|ценное|справедливое|прекрасное) замечание'
  - '(?:отличная|хорошая|ценная) находка'
  - '(?:прекрасный|замечательный) вопрос'
  - 'вы (?:совершенно |полностью )?правы'
  - 'абсолютно верно'
  - 'отличная идея'
