# «Если нужно — могу…»: closing offers of more work.
extends: existence
message: "Предложение в конце: «%s». Закончите содержанием; спросите прямо, только если нужен ответ."
level: error
ignorecase: true
raw:
  - '\b(?:если\s+(?:нужно|надо|хотите|потребуется|понадобится|интересно)\s*[,—–-]+\s*(?:я\s+)?(?:могу|готов|сделаю|добавлю|подготовлю)|чем\s+ещ[её]\s+(?:могу\s+)?помочь|готов\s+помочь)\b'
