# slop-check's Vale config. The wrapper runs `vale --config <this> --no-global`, so nothing
# from the user's own Vale setup leaks in, and the styles are vendored (no `vale sync`, works
# offline). ai-tells and ai-tells-commits are tbhb/vale-ai-tells v1.37.0, unmodified (MIT,
# styles/LICENSE.vale-ai-tells); SlopCheck is ours. Tune vendored rules HERE, never in their
# .yml files, and give every disabled rule its reason.
#
# The disabled rules were picked by running ai-tells over 75 real ultrabricks PR bodies and
# 80 human-written READMEs/docs (2026-10-16): each one below fired mostly on ordinary
# engineering prose, so leaving it on would teach people to ignore the tool.

StylesPath = styles
MinAlertLevel = suggestion

# The wrapper picks the extension per --context: .md for issue/docs/default, .tg for
# Telegram, .pr for PR bodies. All of them are parsed as Markdown.
[formats]
tg = md
pr = md

[*]
BasedOnStyles = ai-tells, SlopCheck

# Replaced by SlopCheck.Sycophancy: same phrases plus "Great catch"/"Good catch", minus the
# bare "Absolutely", "Certainly", "Of course" and "Without a doubt", which are ordinary
# answers ("Of course the cache is per-user").
ai-tells.SycophancyMarkers = NO
# Replaced by SlopCheck.UnprovenTestClaim, which flags "All tests pass" only when no count,
# link or log follows. UniversalSubject/UniversalObject also fire on plain statements such as
# "Every outcome is written to the audit file" or "covers all of".
ai-tells.UniversalSubject = NO
ai-tells.UniversalObject = NO
# Replaced by SlopCheck.Utilize for utilize -> use. The rest of the list is the working
# vocabulary of the field: implement, terminate (a pod), optimize, minimize.
ai-tells.FormalRegister = NO

# Punctuation that technical writing uses on purpose.
# Semicolons join related clauses in change descriptions (130 hits in 75 PR bodies).
ai-tells.SemicolonUsage = NO
# Capitalized words after a colon are labels and list leads ("Fix: Return 404").
ai-tells.ColonUsage = NO
# CLI flags written without backticks (--force) in issues and chat messages.
ai-tells.DoubleHyphen = NO

# Sentence shapes that carry facts in bug reports and PR bodies.
# Three verbs in a row are how a sequence of steps is told ("stops, rebuilds and restarts").
ai-tells.VerbTricolon = NO
ai-tells.VerbTricolonDensity = NO
# "Records no dedup", "No credentials were read", "with no directory and no lock": precise
# statements of absence that verification reports need.
ai-tells.NegatedObject = NO
ai-tells.NegatedPair = NO
ai-tells.NegatedSubject = NO
# "..., no error." / "..., no skips." is how a test result is reported.
ai-tells.ContrastiveNegation = NO
# "Three integration fixtures:" introduces a list with its count; that is not a forecast.
ai-tells.CataphoricForecasting = NO
# ", so the snapshot chain works": a plain causal clause.
ai-tells.ConsequenceClause = NO
# "for example", "therefore", "in addition" are ordinary connectors.
ai-tells.FormalTransitions = NO
# Matches long stretches around colons and fires on lists of evidence.
ai-tells.ServesAsDodge = NO
# Compound technical nouns are normal: "data chunk size limit", "idle exit + socket cleanup".
ai-tells.NounString = NO
# "a single file" and "one single run" state a count.
ai-tells.FillerIntensifier = NO

# Engineering idioms read as metaphors by these rules: a process dies, a rule fires, the flag
# wins, the PR lands, the config lives in, the root owns, the hook forbids, the test trips,
# a fix ships, a change sits on top of, the queue holds, the card reaches the board.
ai-tells.ShipOveruse = NO
ai-tells.MortalityMetaphors = NO
ai-tells.AnthropomorphicCognition = NO
ai-tells.EnforcementMetaphors = NO
ai-tells.BareHolds = NO
ai-tells.BareNames = NO
ai-tells.BareReaches = NO
ai-tells.FigurativeCarries = NO
ai-tells.FigurativeFalls = NO
ai-tells.FigurativeFires = NO
ai-tells.FigurativeHolds = NO
ai-tells.FigurativeLands = NO
ai-tells.FigurativeLives = NO
ai-tells.FigurativeMints = NO
ai-tells.FigurativeOwns = NO
ai-tells.FigurativeRuns = NO
ai-tells.FigurativeShape = NO
ai-tells.FigurativeSits = NO
ai-tells.FigurativeStays = NO
ai-tells.FigurativeSweeps = NO
ai-tells.FigurativeTravels = NO
ai-tells.FigurativeTrips = NO
ai-tells.FigurativeWins = NO

# PR bodies (--context pr) also get ai-tells-commits: "This PR adds", agent attribution
# trailers, hedged "This should fix". The [*] overrides above still apply here.
[*.pr]
BasedOnStyles = ai-tells, ai-tells-commits, SlopCheck

# A PR body should cite test counts as evidence ("95 passed, 0 failed").
ai-tells-commits.CommitTestEnumeration = NO
# A PR body may list the files it touches and what changed in each.
ai-tells-commits.CommitFileListing = NO
# Subject-line rule; past tense is normal in a PR description.
ai-tells-commits.CommitPastTense = NO
# PR bodies use headings ("## Tests"); a commit message should not, a PR body may.
ai-tells-commits.CommitChangelogStyle = NO
# "by hand", "the tree": plain idiom in a PR body.
ai-tells-commits.CommitFigurativeVerbs = NO
ai-tells-commits.CommitGitJargon = NO
